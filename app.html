den;clip: rect(0 0 0 0);clip-path: inset(50%);white-space: nowrap;}.control-bar{padding-left: 0.85rem;}.creator-count{display: none;}.site-footer{display: block;}.footer-meta{margin-top: 0.5rem!important;text-align: left;}}@media (max-width: 390px){.eyebrow{letter-spacing: 0.13em;}.brand-mark{width: 2.65rem;}.auto-time{display: none;}.status{font-size: 0.8rem;}}@media (prefers-reduced-motion: reduce){html{scroll-behavior: auto;}*,*::before,*::after{animation-duration: 0.01ms!important;animation-iteration-count: 1!important;scroll-behavior: auto!important;transition-duration: 0.01ms!important;}}

  <body>
    <a class="skip-link" href="#creators">Skip to creators</a>

    <div class="page-shell">
      <header class="site-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M14.25 3.5v11.2a4.3 4.3 0 1 1-3.08-4.13"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M14.25 4.1c.72 2.91 2.44 4.45 5.25 4.7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>

          <div class="brand-copy">
            <p class="eyebrow">Your TikTok digest</p>
            <h1>Creator watch</h1>
            <p class="tagline">Latest posts from the people you follow.</p>
          </div>
        </div>

        <button class="refresh-button" id="refresh-button" type="button" aria-label="Reload the dashboard">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M20 11a8 8 0 1 0-2.34 6.34M20 5v6h-6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="button-label">Refresh</span>
        </button>
      </header>

      <section class="control-bar" aria-label="Refresh status and settings">
        <div class="status" id="status" data-state="ready">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text" id="status-text">Refreshed just now</span>
          <span class="sr-only" id="live-status" role="status" aria-live="polite"></span>
        </div>

        <div class="control-actions">
          <span class="creator-count" id="creator-count">1 creator</span>

          <label
            class="auto-refresh"
            title="Reload the dashboard automatically while this tab is visible"
          >
            <input type="checkbox" id="auto-refresh" aria-label="Auto-refresh every 5 minutes" />
            <span class="switch" aria-hidden="true"></span>
            <span>Auto <span class="auto-time">5 min</span></span>
          </label>
        </div>
      </section>

      <main id="creators" class="creator-grid" aria-label="Followed TikTok creators"></main>

      <footer class="site-footer">
        <p>
          Embeds show each creator&rsquo;s newest posts. Auto-refresh reloads the dashboard every
          5 minutes while it is open.
        </p>
        <p class="footer-meta">Unofficial dashboard &middot; Content served by TikTok</p>
      </footer>
    </div>

    <noscript>
      <div class="noscript">This page needs JavaScript to load the TikTok creator embeds.</div>
    </noscript>

    <script>
'use strict';
const CREATORS=[
{handle:'nykolas.nyk79'},
{handle:'nyk.nykolas2'},
{handle:'aniolku._.b'},
];
const SETTINGS={
autoRefreshMinutes:5,
autoRefreshStorageKey:'creator-watch:auto-refresh',
embedScriptUrl:'https://www.tiktok.com/embed.js',
embedStaggerMs:4000,
embedVisibilityThreshold:0.2,
embedRenderTimeoutMs:15000,
statusClockIntervalMs:20000,
};
const ui={
grid:document.querySelector('#creators'),
refreshButton:document.querySelector('#refresh-button'),
autoRefresh:document.querySelector('#auto-refresh'),
status:document.querySelector('#status'),
statusText:document.querySelector('#status-text'),
liveStatus:document.querySelector('#live-status'),
creatorCount:document.querySelector('#creator-count'),
};
const state={
autoRefresh:readAutoRefreshPreference(),
lastRefresh:Date.now(),
statusKind:'ready',
embedQueue:[],
embedBusy:false,
visibilityFrame:0,
};
const creators=normalizeCreators(CREATORS);
initialize();
function initialize(){
renderCreatorShells();
bindControls();
updateCreatorCount();
ui.autoRefresh.checked=state.autoRefresh;
if(!creators.length){
setStatus('error','No creators configured yet');
ui.refreshButton.disabled=true;
return;
}
setStatus('ready','Refreshed just now');
startStatusClock();
scheduleVisibilityCheck();
}
function normalizeCreators(entries){
const seen=new Set();
return(Array.isArray(entries)?entries:[])
.map((entry)=>{
const value=typeof entry==='string'?entry:entry?.handle;
const handle=normalizeHandle(value);
return handle?{handle}:null;
})
.filter((creator)=>{
if(!creator||seen.has(creator.handle))return false;
seen.add(creator.handle);
return true;
});
}
function normalizeHandle(value){
if(!value)return '';
let handle=String(value).trim();
if(/^https?:\/\//i.test(handle)){
const match=handle.match(/tiktok\.com\/@([^/?#]+)/i);
if(!match)return '';
handle=match[1];
}
try{
handle=decodeURIComponent(handle);
}catch{
return '';
}
return handle
.replace(/^@/,'')
.replace(/[^\p{L}\p{N}._-]/gu,'')
.slice(0,64);
}
function createEmbedBlockquote(handle){
const blockquote=document.createElement('blockquote');
blockquote.className='tiktok-embed';
blockquote.cite=`https://www.tiktok.com/@${handle}`;
blockquote.dataset.uniqueId=handle;
blockquote.dataset.embedType='creator';
blockquote.style.maxWidth='780px';
blockquote.style.minWidth='0';
blockquote.style.margin='0';
const section=document.createElement('section');
const profileLink=document.createElement('a');
profileLink.target='_blank';
profileLink.rel='noopener noreferrer';
profileLink.href=`https://www.tiktok.com/@${handle}?refer=creator_embed`;
profileLink.textContent=`@${handle}`;
section.append(profileLink);
blockquote.append(section);
return blockquote;
}
function createEmbedPlaceholder(handle){
const placeholder=document.createElement('div');
placeholder.className='embed-placeholder';
const spinner=document.createElement('span');
spinner.className='embed-placeholder-spinner';
spinner.setAttribute('aria-hidden','true');
const label=document.createElement('span');
label.className='embed-placeholder-label';
label.textContent=`Loading @${handle}...`;
placeholder.append(spinner,label);
return placeholder;
}
function createEmbedError(handle){
const error=document.createElement('p');
error.className='embed-error';
error.textContent=`@${handle} could not be loaded. Refresh the page to try again.`;
return error;
}
function renderCreatorShells(){
const fragment=document.createDocumentFragment();
creators.forEach(({handle})=>{
const article=document.createElement('article');
article.className='creator';
article.dataset.handle=handle;
article.dataset.embedState='pending';
article.setAttribute('aria-label',`TikTok posts from @${handle}`);
const embedSlot=document.createElement('div');
embedSlot.className='creator-embed';
embedSlot.dataset.state='pending';
embedSlot.append(createEmbedPlaceholder(handle));
article.append(embedSlot);
fragment.append(article);
});
ui.grid.replaceChildren(fragment);
ui.grid.dataset.count=String(creators.length);
}
function scheduleVisibilityCheck(){
if(state.visibilityFrame)return;
state.visibilityFrame=window.requestAnimationFrame(()=>{
state.visibilityFrame=0;
queueVisibleCreators();
});
}
function queueVisibleCreators(){
ui.grid.querySelectorAll('.creator[data-embed-state="pending"]').forEach((article)=>{
if(isCreatorVisible(article))queueCreatorEmbed(article);
});
}
function isCreatorVisible(article){
const rect=article.getBoundingClientRect();
const viewportHeight=document.documentElement.clientHeight;
const visibleHeight=
Math.min(rect.bottom,viewportHeight)- Math.max(rect.top,0);
const measurableHeight=Math.min(rect.height,viewportHeight);
if(visibleHeight<=0||measurableHeight<=0)return false;
return visibleHeight / measurableHeight>=SETTINGS.embedVisibilityThreshold;
}
function queueCreatorEmbed(article){
if(article.dataset.embedState!=='pending')return;
article.dataset.embedState='queued';
state.embedQueue.push(article);
processEmbedQueue();
}
function processEmbedQueue(){
if(state.embedBusy)return;
const article=state.embedQueue.shift();
if(!article)return;
state.embedBusy=true;
loadCreatorEmbed(article).finally(()=>{
window.setTimeout(()=>{
state.embedBusy=false;
processEmbedQueue();
},SETTINGS.embedStaggerMs);
});
}
function loadCreatorEmbed(article){
const handle=article.dataset.handle;
const embedSlot=article.querySelector('.creator-embed');
if(!handle||!embedSlot)return Promise.resolve();
article.dataset.embedState='loading';
embedSlot.dataset.state='loading';
embedSlot.replaceChildren(createEmbedBlockquote(handle));
return injectTikTokEmbedScript()
.then(()=>{
watchEmbedRender(article,embedSlot);
})
.catch(()=>{
article.dataset.embedState='error';
embedSlot.dataset.state='error';
embedSlot.replaceChildren(createEmbedError(handle));
setStatus('error','Some TikTok embeds could not load. Refresh to retry.');
});
}
function injectTikTokEmbedScript(){
return new Promise((resolve,reject)=>{
const script=document.createElement('script');
script.src=SETTINGS.embedScriptUrl;
script.async=true;
script.addEventListener(
'load',
()=>{
script.remove();
resolve();
},
{once:true},
);
script.addEventListener(
'error',
()=>{
script.remove();
reject(new Error('TikTok embed script failed to load'));
},
{once:true},
);
document.body.append(script);
});
}
function watchEmbedRender(article,embedSlot){
const blockquote=embedSlot.querySelector('.tiktok-embed');
const startedAt=Date.now();
const timer=window.setInterval(()=>{
const iframe=blockquote?.querySelector('iframe');
const timedOut=Date.now()- startedAt>=SETTINGS.embedRenderTimeoutMs;
if(!iframe&&!timedOut)return;
window.clearInterval(timer);
if(!iframe)return;
article.dataset.embedState='ready';
embedSlot.dataset.state='ready';
},250);
}
function bindControls(){
ui.refreshButton.addEventListener('click',reloadDashboard);
window.addEventListener('scroll',scheduleVisibilityCheck,{passive:true});
window.addEventListener('resize',scheduleVisibilityCheck);
ui.autoRefresh.addEventListener('change',()=>{
state.autoRefresh=ui.autoRefresh.checked;
persistAutoRefreshPreference(state.autoRefresh);
checkAutoRefresh();
});
document.addEventListener('visibilitychange',()=>{
if(document.visibilityState==='visible'){
checkAutoRefresh();
}
});
}
function reloadDashboard(){
window.location.reload();
}
function startStatusClock(){
window.setInterval(()=>{
if(state.statusKind==='ready'){
updateStatusLabel();
}
checkAutoRefresh();
},SETTINGS.statusClockIntervalMs);
}
function updateStatusLabel(){
ui.statusText.textContent=relativeRefreshLabel(state.lastRefresh);
ui.status.title=`Last refreshed at ${new Date(state.lastRefresh).toLocaleTimeString(
    [],
    { hour: '2-digit', minute: '2-digit' },
  )}`;
}
function relativeRefreshLabel(timestamp){
const elapsed=Math.max(0,Date.now()- timestamp);
if(elapsed<15000)return 'Refreshed just now';
if(elapsed<60000)return `Refreshed ${Math.floor(elapsed / 1000)} sec ago`;
const minutes=Math.floor(elapsed / 60000);
if(minutes===1)return 'Refreshed 1 min ago';
if(minutes<60)return `Refreshed ${minutes} min ago`;
const hours=Math.floor(minutes / 60);
return `Refreshed ${hours} hr${hours === 1 ? '' : 's'} ago`;
}
function checkAutoRefresh(){
if(
!state.autoRefresh||
!creators.length||
document.visibilityState!=='visible'
){
return;
}
if(Date.now()- state.lastRefresh>=autoRefreshInterval()){
reloadDashboard();
}
}
function autoRefreshInterval(){
return SETTINGS.autoRefreshMinutes * 60 * 1000;
}
function setStatus(kind,message){
state.statusKind=kind;
ui.status.dataset.state=kind;
ui.statusText.textContent=message;
ui.status.title=message;
ui.liveStatus.textContent=message;
}
function updateCreatorCount(){
ui.creatorCount.textContent=
creators.length===1?'1 creator':`${creators.length} creators`;
}
function readAutoRefreshPreference(){
try{
const saved=window.localStorage.getItem(SETTINGS.autoRefreshStorageKey);
return saved===null?true:saved==='true';
}catch{
return true;
}
}
function persistAutoRefreshPreference(enabled){
try{
window.localStorage.setItem(SETTINGS.autoRefreshStorageKey,String(enabled));
}catch{
}
}
    </script>
  </body>
