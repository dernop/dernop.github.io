<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Creator watch — plain embeds</title>
  </head>
  <body>
    <blockquote
      class="tiktok-embed"
      cite="https://www.tiktok.com/@nykolas.nyk79"
      data-unique-id="nykolas.nyk79"
      data-embed-type="creator"
      style="max-width: 780px; min-width: 0; margin: 0"
    >
      <section>
        <a
          target="_blank"
          rel="noopener noreferrer"
          href="https://www.tiktok.com/@nykolas.nyk79?refer=creator_embed"

        >
      </section>
